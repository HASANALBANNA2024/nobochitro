name: nobochitro
description: "A professional photography application for Web, Android, and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  image_picker: ^1.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# (Android, iOS & Web support)
# (অ্যাডাপ্টিভ আইকন কনফিগারেশন - লঞ্চার আইকনের জন্য)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#121212"
    theme_color: "#121212"
  image_path: "assets/images/app_icon.png"
  # অ্যান্ড্রয়েডে আইকন যেন গোল বা স্কয়ার শেপের ভেতর থাকে তার জন্য:
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# (নেটিভ স্প্ল্যাশ কনফিগারেশন)
flutter_native_splash:
  color: "#121212" # আপনার ডার্ক থিমের সাথে মিল রেখে ব্যাকগ্রাউন্ড কালো করলাম
  image: "assets/images/app_icon.png"

  android_12:
    image: "assets/images/app_icon.png"
    # আইকনকে একটি শেপের ভেতর দেখানোর জন্য নিচের কালারটি মাস্ট:
    icon_background_color: "#121212"
    # ডার্ক মোডের জন্য আলাদা সাপোর্ট (ঐচ্ছিক কিন্তু ভালো)
    image_dark: "assets/images/app_icon.png"
    icon_background_color_dark: "#121212"

  web: true
  fullscreen: true
  android: true
  ios: true


flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png